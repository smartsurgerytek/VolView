#======= aws workflow start



name: CI/CD - Build & Deploy VolView (Integration)

on:
  push:
    branches:
      - volview_aws_migration

env:
  ECR_REGISTRY: 587128718062.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPO: 587128718062.dkr.ecr.ap-south-1.amazonaws.com/idental
  VM_USER: ubuntu
  K8S_NAMESPACE: foundation

  # Build Arguments for VolView Frontend
  # VV_DICOMWEB_URL: http://idental-int.getsmartsurgery.net:30080/dicom-web
  VV_DICOMWEB_URL: https://idental-int.getsmartsurgery.net:30367/dicom-web
  VV_FOUNDATION_API: https://idental-int.getsmartsurgery.net:30367/api/volview
  VV_FASTAPI_URL: https://idental-int.getsmartsurgery.net:30173/api
  VV_FOUNDATION_WEB: https://idental-int.getsmartsurgery.net:30398

jobs:
  # ──────────────────────────────────────────
  # JOB 1: BUILD & PUSH - VolView Frontend
  # ──────────────────────────────────────────
  build-volview-frontend:
    name: Build & Push VolView Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache || true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push VolView Frontend
        run: |
          docker build \
            --target frontend \
            --no-cache \
            --build-arg DICOMWEB_URL=${{ env.VV_DICOMWEB_URL }} \
            --build-arg FOUNDATION_API=${{ env.VV_FOUNDATION_API }} \
            --build-arg FASTAPI_URL=${{ env.VV_FASTAPI_URL }} \
            --build-arg FOUNDATION_WEB=${{ env.VV_FOUNDATION_WEB }} \
            -f Dockerfile.Integration \
            -t ${{ env.ECR_REPO }}:volview-frontend-${{ github.sha }} \
            -t ${{ env.ECR_REPO }}:volview-frontend-latest \
            .
          docker push ${{ env.ECR_REPO }}:volview-frontend-${{ github.sha }}
          docker push ${{ env.ECR_REPO }}:volview-frontend-latest

  # ──────────────────────────────────────────
  # JOB 2: BUILD & PUSH - VolView Backend
  # ──────────────────────────────────────────
  build-volview-backend:
    name: Build & Push VolView Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache || true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push VolView Backend
        run: |
          docker build \
            --target backend \
            --no-cache \
            -f Dockerfile.Integration \
            -t ${{ env.ECR_REPO }}:volview-backend-${{ github.sha }} \
            -t ${{ env.ECR_REPO }}:volview-backend-latest \
            .
          docker push ${{ env.ECR_REPO }}:volview-backend-${{ github.sha }}
          docker push ${{ env.ECR_REPO }}:volview-backend-latest

  # ──────────────────────────────────────────
  # JOB 3: DEPLOY to k3s VM
  # ──────────────────────────────────────────
  deploy:
    name: Deploy to k3s VM
    runs-on: ubuntu-latest
    needs: [build-volview-frontend, build-volview-backend]
    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            ECR_REGISTRY="587128718062.dkr.ecr.ap-south-1.amazonaws.com"
            REPO="$ECR_REGISTRY/idental"
            SHA="${{ github.sha }}"
            NS="foundation"

            echo "=== Fix kubeconfig permissions ==="
            sudo chmod 644 /etc/rancher/k3s/k3s.yaml

            echo "=== Login to ECR ==="
            ECR_PASS=$(aws ecr get-login-password --region ap-south-1)

            echo "=== Pull VolView images into k3s containerd ==="
            sudo k3s ctr images pull \
              --user "AWS:$ECR_PASS" \
              $REPO:volview-frontend-$SHA

            sudo k3s ctr images pull \
              --user "AWS:$ECR_PASS" \
              $REPO:volview-backend-$SHA

            echo "=== Update k3s deployments with new images ==="
            kubectl set image deployment/volview-frontend \
              volview-frontend=$REPO:volview-frontend-$SHA -n $NS
            kubectl set image deployment/volview-backend \
              volview-backend=$REPO:volview-backend-$SHA -n $NS

            echo "=== Update imagePullPolicy ==="
            kubectl patch deployment volview-frontend -n $NS \
              --type=json -p='[{"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"IfNotPresent"}]'
            kubectl patch deployment volview-backend -n $NS \
              --type=json -p='[{"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"IfNotPresent"}]'

            echo "=== Rollout restart ==="
            kubectl rollout restart deployment/volview-frontend -n $NS
            kubectl rollout restart deployment/volview-backend -n $NS

            echo "=== Wait for rollouts ==="
            kubectl rollout status deployment/volview-frontend -n $NS --timeout=300s || true
            kubectl rollout status deployment/volview-backend -n $NS --timeout=300s || true

            echo "=== Done! ==="
            kubectl get pods -n $NS | grep volview




























